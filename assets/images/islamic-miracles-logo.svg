<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Background -->
  <circle cx="100" cy="100" r="95" fill="#1B4332"/>
  <circle cx="100" cy="100" r="90" fill="#2D6A4F"/>

  <!-- Crescent Moon -->
  <path d="M120 50 Q140 50 140 70 Q140 90 120 90 Q130 90 130 70 Q130 50 120 50 Z" fill="#FFFFFF"/>

  <!-- Star -->
  <path d="M155 70 L158 80 L168 80 L160 86 L163 96 L155 90 L147 96 L150 86 L142 80 L152 80 Z" fill="#FFFFFF"/>

  <!-- Open Book -->
  <g transform="translate(65, 95)">
    <!-- Left page -->
    <path d="M0 0 Q-2 20 0 40 L25 40 L25 0 Z" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
    <!-- Right page -->
    <path d="M25 0 L25 40 L50 40 Q52 20 50 0 Z" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
    <!-- Center binding -->
    <line x1="25" y1="0" x2="25" y2="40" stroke="#1B4332" stroke-width="2"/>
    <!-- Decorative lines (text) -->
    <line x1="5" y1="10" x2="20" y2="10" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="15" x2="20" y2="15" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="20" x2="20" y2="20" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="10" x2="45" y2="10" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="15" x2="45" y2="15" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="20" x2="45" y2="20" stroke="#1B4332" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Decorative Islamic Pattern Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#64bf46" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

  <!-- Text (optional - can be removed if using actual text elsewhere) -->
  <text x="100" y="165" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ISLAMIC</text>
  <text x="100" y="182" text-anchor="middle" fill="#B7E4C7" font-family="Arial, sans-serif" font-size="12">MIRACLES</text>
</svg>
